<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slide 7 - Mission Room 2 | PLANET MISSION LAB</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* ==========================================================================
       REVISI SLIDE 7: MISSION ROOM 2 (OPTIMALISASI LAYAR PID & PROYEKTOR)
       ========================================================================== */
    
    /* Layout Utama Slide 7: Terpusat dan Proporsional di Layar 16:9 */
    .slide-mission2-main {
      display: flex !important;
      flex-direction: column !important;
      justify-content: flex-start !important;
      align-items: center !important;
      height: 100% !important;
      min-height: 100% !important;
      box-sizing: border-box !important;
      padding-top: clamp(48px, 6.8vh, 68px) !important;
      padding-bottom: clamp(65px, 8.5vh, 88px) !important;
      padding-left: clamp(20px, 2.5vw, 40px) !important;
      padding-right: clamp(20px, 2.5vw, 40px) !important;
      background: transparent !important;
      position: relative !important;
    }

    /* Container Area Game (Kartu Karakteristik + Deretan Planet) */
    .mission2-stage-container {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: clamp(28px, 3.5vw, 56px) !important;
      width: 100% !important;
      max-width: clamp(1000px, 92vw, 1260px) !important;
      margin: auto 0 !important; /* Vertically centered di ruang kerja */
      position: relative !important;
      z-index: 10 !important;
    }

    /* --------------------------------------------------------------------------
       1. KOTAK TANTANGAN (CHALLENGE CARD) DIPERBESAR & ELEGAN
       -------------------------------------------------------------------------- */
    .mission2-clues-card {
      width: clamp(320px, 34vw, 420px) !important;
      background: linear-gradient(145deg, #FEF08A 0%, #FDE047 100%) !important;
      border: 3.5px solid #F59E0B !important;
      border-radius: 28px !important;
      padding: clamp(22px, 2.6vh, 32px) clamp(24px, 2.6vw, 36px) !important;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), 0 0 24px rgba(253, 224, 71, 0.35) !important;
      color: #1E1B4B !important;
      box-sizing: border-box !important;
      position: relative !important;
      flex-shrink: 0 !important;
    }

    /* Tulisan Badge "TANTANGAN 1/3" Diperbesar */
    .mission2-round-badge {
      display: inline-block !important;
      font-size: clamp(13px, 1.4vw, 16.5px) !important;
      font-weight: 900 !important;
      color: #78350F !important;
      background: rgba(245, 158, 11, 0.22) !important;
      border: 1.5px solid rgba(180, 83, 9, 0.35) !important;
      border-radius: 12px !important;
      padding: 4px 14px !important;
      margin-bottom: clamp(12px, 1.5vh, 18px) !important;
      text-transform: uppercase !important;
      letter-spacing: 1.5px !important;
    }

    /* Daftar Karakteristik / Clues Diperbesar & Sangat Jelas untuk Proyektor */
    .mission2-clues-list {
      list-style: none !important;
      padding: 0 !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: clamp(10px, 1.4vh, 16px) !important;
    }

    .mission2-clues-list li {
      font-size: clamp(16px, 1.75vw, 21.5px) !important;
      font-weight: 800 !important;
      color: #1E1B4B !important;
      line-height: 1.38 !important;
      display: flex !important;
      align-items: flex-start !important;
      gap: 10px !important;
    }

    .mission2-clues-list li::before {
      content: "•" !important;
      color: #D97706 !important;
      font-size: 1.35em !important;
      line-height: 1 !important;
      flex-shrink: 0 !important;
    }

    /* --------------------------------------------------------------------------
       2. DERETAN PLANET PILIHAN (DIPERBESAR & STATIS)
       -------------------------------------------------------------------------- */
    .mission2-options-row {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: clamp(20px, 2.8vw, 44px) !important;
      flex-shrink: 0 !important;
    }

    .mission2-planet-choice {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: clamp(10px, 1.2vh, 16px) !important;
      cursor: pointer !important;
      position: relative !important;
      transform-origin: center center !important;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1) !important;
      touch-action: manipulation !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      animation: none !important; /* Mencegah animasi loop pada container */
    }

    /* GAMBAR PLANET STATIS (HILANGKAN ROTASI/PERGERAKAN OTOMATIS) */
    .mission2-choice-img {
      width: clamp(140px, 16.5vw, 210px) !important;
      height: clamp(140px, 16.5vw, 210px) !important;
      object-fit: contain !important;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.75)) !important;
      animation: none !important; /* HILANGKAN ROTASI / ANIMASI OTOMATIS */
      transform: none !important;
      transform-origin: center center !important;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), filter 0.28s ease !important;
      pointer-events: auto !important;
    }

    /* --------------------------------------------------------------------------
       3. EFEK HOVER: MEMBESAR HALUS & CAHAYA GLOW (TANPA ROTASI & TANPA SHIFT)
       -------------------------------------------------------------------------- */
    .mission2-planet-choice:hover {
      transform: scale(1.10) !important; /* Membesar halus antara 1.08 - 1.12 */
      animation: none !important;
    }

    .mission2-planet-choice:hover .mission2-choice-img {
      animation: none !important; /* Tetap statis, tidak berputar saat hover */
      filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.85))
              drop-shadow(0 0 22px rgba(56, 189, 248, 0.9))
              drop-shadow(0 0 38px rgba(186, 230, 253, 0.55)) !important;
    }

    .mission2-planet-choice:hover .mission2-choice-name {
      color: #FDE047 !important;
      text-shadow: 0 0 16px rgba(253, 224, 71, 0.95), 0 2px 6px rgba(0, 0, 0, 0.9) !important;
    }

    /* Feedback Sentuhan untuk PID Touchscreen */
    .mission2-planet-choice:active {
      transform: scale(1.06) !important;
    }

    .mission2-planet-choice:active .mission2-choice-img {
      filter: drop-shadow(0 0 26px rgba(253, 224, 71, 0.9)) !important;
    }

    /* --------------------------------------------------------------------------
       4. LABEL NAMA PLANET DIPERBESAR
       -------------------------------------------------------------------------- */
    .mission2-choice-name {
      font-family: var(--font-body), sans-serif !important;
      font-size: clamp(18px, 1.9vw, 24px) !important;
      font-weight: 900 !important;
      color: #FFFFFF !important;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.9), 0 0 10px rgba(56, 189, 248, 0.5) !important;
      margin-top: 2px !important;
      letter-spacing: 0.5px !important;
      text-align: center !important;
      transition: color 0.25s ease, text-shadow 0.25s ease !important;
    }
  </style>
</head>
<body>

  <!-- VIEWPORT 16:9 CONTAINER -->
  <div id="viewport-wrapper">
    <div id="app-stage" style="background-image: url('assets/bg%20keseluruhan.png');">

      <!-- ====================================================================
           GLOBAL HUD (MENGGUNAKAN ASET TOMBOL DARI FOLDER ASSETS)
           ==================================================================== -->
      <header class="stage-hud">
        <div class="hud-left" style="gap: 20px;">
          <!-- Tombol Menu Utama dari Aset -->
          <button id="btn-back-menu" class="asset-icon-btn" data-tooltip="Menu Utama" title="Kembali ke Menu Utama">
            <img src="assets/Tombol%20Rumah.png" alt="Kembali ke Menu Utama">
          </button>

          <!-- Tombol Suara dari Aset -->
          <button id="btn-global-audio" class="asset-icon-btn" data-tooltip="Pengaturan Suara" title="Pengaturan Audio (Tekan M)">
            <img src="assets/Tombol%20Suara.png" alt="Tombol Suara">
          </button>
        </div>

        <div class="hud-center">
          <!-- Spacer HUD Center -->
        </div>

        <div class="hud-right" style="gap: 20px;">
          <!-- Tombol Layar Penuh Proyektor -->
          <button id="btn-global-fullscreen" class="arcade-circle-btn btn-fullscreen" title="Layar Penuh Proyektor (F)">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </header>

      <!-- ====================================================================
           SLIDE 7 CONTENT: MISSION ROOM 2 (TEBAK KARAKTERISTIK)
           ==================================================================== -->
      <main class="slide active slide-mission2-main">
        <h2 class="arcade-header-title" style="margin-bottom: 2px;">MISSION ROOM 2</h2>
        <p class="mission-instruction-text" style="margin-bottom: 16px;">
          Pilih planet yg sesuai dengan karakteristik berikut:
        </p>

        <div class="mission2-stage-container">
          <!-- KARTU KUNING KARAKTERISTIK -->
          <div class="mission2-clues-card">
            <div id="m2-round-badge" class="mission2-round-badge">
              Tantangan 1 / 3
            </div>
            <ul id="m2-clues-list" class="mission2-clues-list"></ul>
          </div>

          <!-- 3 PILIHAN GAMBAR PLANET REALISTIS -->
          <div id="m2-options-row" class="mission2-options-row"></div>
        </div>

        <!-- Tombol Navigasi Bawah -->
        <div class="slide-nav-bottom">
          <div id="btn-prev-m1" class="nav-btn-wrapper">
            <button class="arcade-circle-btn btn-home">
              <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <span class="nav-label">Mission Room I</span>
          </div>

          <div id="btn-direct-quiz" class="nav-btn-wrapper" title="Selesaikan Mission Room & Kembali ke Menu Utama">
            <span class="nav-label">Selesaikan Misi 3 & Lanjut ke Menu Utama</span>
            <button class="arcade-circle-btn btn-home">
              <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
          </div>
        </div>
      </main>

    </div>
  </div>


  <!-- ======================================================================
       POPUP FEEDBACK MODAL (SUKSES / GAGAL)
       ====================================================================== -->
  <div id="modal-feedback" class="modal-feedback-overlay">
    <div id="feedback-card-container" class="feedback-card-container">
      <div id="feedback-badge-icon" class="feedback-badge-icon success">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </div>

      <p id="feedback-message-text" class="feedback-message-text">
        Yeay! Jawabanmu benar, kamu boleh menjelajah ke petualangan selanjutnya!
      </p>

      <button id="feedback-modal-btn" class="feedback-action-btn-circle" title="Lanjut">
        <svg id="modal-icon-next" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        <svg id="modal-icon-retry" style="display: none;" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </div>


  <!-- ======================================================================
       SCRIPTS
       ====================================================================== -->
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CommonHUD.init('slide-7');

      let currentRound = 0;
      const rounds = PLANET_DATA.missions.mission2Rounds;

      // Navigasi
      const btnMenu = document.getElementById('btn-back-menu');
      const btnPrev = document.getElementById('btn-prev-m1');
      const btnQuiz = document.getElementById('btn-direct-quiz');
      if (btnMenu) btnMenu.addEventListener('click', () => {
        CommonAudio.play('button');
        CommonHUD.navigate('slide-2.html');
      });
      if (btnPrev) btnPrev.addEventListener('click', () => {
        CommonAudio.play('button');
        CommonHUD.navigate('slide-6.html');
      });
      if (btnQuiz) {
        btnQuiz.addEventListener('click', () => {
          CommonAudio.play('success');
          CommonState.unlockMission(4); // Membuka Misi 4 (Quiz)
          CommonHUD.navigate('slide-2.html'); // Kembali ke Slide 2 (Menu Utama)
        });
      }

      function renderRound(idx) {
        const roundData = rounds[idx];
        if (!roundData) return;

        const roundBadge = document.getElementById('m2-round-badge');
        const cluesList = document.getElementById('m2-clues-list');
        const optionsRow = document.getElementById('m2-options-row');

        if (roundBadge) roundBadge.textContent = `Tantangan ${idx + 1} / ${rounds.length}`;

        if (cluesList) {
          cluesList.innerHTML = '';
          roundData.clues.forEach(clue => {
            const li = document.createElement('li');
            li.textContent = clue;
            cluesList.appendChild(li);
          });
        }

        if (optionsRow) {
          optionsRow.innerHTML = '';
          roundData.options.forEach(opt => {
            const choice = document.createElement('div');
            choice.className = 'mission2-planet-choice';
            choice.setAttribute('title', 'Pilih planet ' + opt.name);
            choice.innerHTML = `
              <img class="mission2-choice-img" src="${opt.image}" alt="${opt.name}">
              <span class="mission2-choice-name">${opt.name}</span>
            `;

            choice.addEventListener('click', () => {
              handleChoice(opt.isCorrect);
            });

            optionsRow.appendChild(choice);
          });
        }
      }

      function handleChoice(isCorrect) {
        const modal = document.getElementById('modal-feedback');
        const badge = document.getElementById('feedback-badge-icon');
        const msg = document.getElementById('feedback-message-text');
        const iconNext = document.getElementById('modal-icon-next');
        const iconRetry = document.getElementById('modal-icon-retry');
        const btnAction = document.getElementById('feedback-modal-btn');

        if (isCorrect) {
          CommonAudio.play('correct');
          badge.className = 'feedback-badge-icon success';
          badge.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
          
          const isFinal = currentRound >= rounds.length - 1;
          msg.textContent = isFinal 
            ? 'Hebat! Seluruh tantangan Mission Room berhasil diselesaikan! Pintu Quiz sekarang telah terbuka. Kembali ke Menu Utama untuk melanjutkan!'
            : 'Yeay! Jawabanmu benar, kamu boleh menjelajah ke tantangan selanjutnya!';
          
          iconNext.style.display = 'block';
          iconRetry.style.display = 'none';

          btnAction.onclick = () => {
            modal.classList.remove('active');
            if (!isFinal) {
              currentRound++;
              renderRound(currentRound);
            } else {
              CommonState.unlockMission(4); // Buka Misi 4 (Quiz)
              CommonHUD.navigate('slide-2.html'); // Kembali ke Slide 2 (Menu Utama)
            }
          };
        } else {
          CommonAudio.play('wrong');
          badge.className = 'feedback-badge-icon failure';
          badge.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
          msg.textContent = 'Jawabanmu salah, coba kembali pelajari ciri-ciri karakteristiknya dan coba lagi!';
          iconNext.style.display = 'none';
          iconRetry.style.display = 'block';

          btnAction.onclick = () => {
            modal.classList.remove('active');
          };
        }

        modal.classList.add('active');
      }

      renderRound(0);
    });
  </script>
</body>
</html>
